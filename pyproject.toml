[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-metrics"
version = "1.0.0"
description = "Poll and chart Twitch channel viewers, followers and chat size"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["twitch", "helix", "metrics", "viewers", "followers", "chart"]

# No runtime dependencies, by design. Everything uses the Python standard
# library, so there is nothing to install and nothing to keep patched.
dependencies = []

[project.optional-dependencies]
# Still empty, and it stays empty: SVG-to-PNG needs the `rsvg-convert` BINARY
# (apt install librsvg2-bin), not a Python package, so there is nothing pip can
# do about it. Required by `daily`, which writes PNGs because Drive previews
# those and mostly offers an SVG as a download. Polling and `graph` need nothing.
png = []

[project.scripts]
twitch-metrics = "twitchmetrics.cli:main"

[tool.setuptools]
packages = ["twitchmetrics", "twitchmetrics.commands"]
