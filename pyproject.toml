[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-metrics"
version = "1.0.0"
description = "Poll and chart Twitch and YouTube channel metrics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["twitch", "helix", "youtube", "metrics", "viewers", "followers", "chart"]

# No runtime dependencies, by design. Everything uses the Python standard
# library, so there is nothing to install and nothing to keep patched.
dependencies = []

[project.optional-dependencies]
# Only needed to convert the generated SVGs to PNG (for a README or a report).
# The charts themselves need none of this.
png = []

[project.scripts]
twitch-metrics = "twitchmetrics.cli:main"

[tool.setuptools]
packages = ["twitchmetrics", "twitchmetrics.commands"]
